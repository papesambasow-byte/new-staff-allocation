stages:
  - build
  - docker
  - nexus

variables:
  GIT_COMMIT_SHORT: "$CI_COMMIT_SHORT_SHA"
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

# Use CI variables for credentials in project settings
# DOCKER_USER, DOCKER_PASS, NEXUS_USER, NEXUS_PASS

default:
  image: node:22
  before_script:
    - cd front

cache:
  key: "front-node-modules-{{ checksum \"front/package-lock.json\" }}"
  paths:
    - front/node_modules/

build:
  stage: build
  script:
    - echo "🛠️ Installation des dépendances…"
    - npm ci
    - echo "🧪 Lancement des tests…"
    - npm test || echo "⚠️ Aucun test défini"
  artifacts:
    paths:
      - front/node_modules/
    expire_in: 1h
  rules:
    - changes: [front/**]
    - when: never

docker:
  stage: docker
  image: docker:24.0
  services:
    - name: docker:dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "🔐 Connexion à Docker Hub"
    - echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin
    - echo "🐳 Build de l'image front"
    - docker build -t "$DOCKER_USER/nodeapp:$GIT_COMMIT_SHORT" .
    - docker push "$DOCKER_USER/nodeapp:$GIT_COMMIT_SHORT"
    - docker tag "$DOCKER_USER/nodeapp:$GIT_COMMIT_SHORT" "$DOCKER_USER/nodeapp:latest"
    - docker push "$DOCKER_USER/nodeapp:latest"
  rules:
    - changes: [front/**]
    - when: never

nexus:
  stage: nexus
  image: node:22
  script:
    - echo "🗝️ Création du fichier .npmrc avec authentification (Nexus)"
    - |
      # Option A: username:password base64 (existante)
      echo "//$(echo $NEXUS_URL | sed 's|https\?://||'):_auth=$(echo -n $NEXUS_USER:$NEXUS_PASS | base64)" > ~/.npmrc
      echo "always-auth=true" >> ~/.npmrc
      echo "registry=$NEXUS_URL" >> ~/.npmrc
    - echo "📦 Publication du package sur Nexus (si package.json le permet)"
    - npm publish --registry "$NEXUS_URL"
  rules:
    # Typically only publish from main branch or tags
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [front/**]
    - if: '$CI_COMMIT_TAG'
      changes: [front/**]
