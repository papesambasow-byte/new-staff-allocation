stages:
  - test
  - build
  - nexus
  - sonar
  - oc-deploy

default:
  tags:
    - osl-runner-front 

variables:
  APP: "new-staff-allocation-server"
  IMAGE_NAME: "sonatelsn/${APP}"
  IMAGE_TAG: "latest"
  CACHE_DIR: "cache"
  CACHE_FILE: "image-${APP}.tar.gz"
  NEXUS_REGISTRY: "$NEXUS_URL/repository/new-staff-allocation-server/"
  TRIVY_VERSION: "0.51.1"
 

# -------------------------
# TESTS
# -------------------------
test-server:
  stage: test
  image: node:18
  script:
    - cd server
    - npm install
    - npm ci
    - npx eslint src || true
    - npm test -- --coverage --passWithNoTests
    - npm run build
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"

# -------------------------
# BUILD DOCKER IMAGE
# -------------------------
build-server:
  stage: build
  image: quay.io/containers/podman:latest
  before_script:
    - echo "$DOCKER_PASSWORD" | podman login --username "$DOCKER_USERNAME" --password-stdin docker.io || true
    - curl -sfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -o trivy.tar.gz
    - tar -xzf trivy.tar.gz trivy
    - chmod +x trivy
    - ./trivy --version
    - curl -sL -o jq https://github.com/stedolan/jq/releases/download/jq-1.7.1/jq-linux64
    - chmod +x jq
    - ./jq --version

  script:
    - cd server
    - podman system prune -f -a || true

    # Build image
    - podman build -t $IMAGE_NAME:$IMAGE_TAG .
    - podman tag $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:ci-$CI_COMMIT_SHORT_SHA

    # Sauvegarde locale de l’image pour scan
    - mkdir -p ../$CACHE_DIR
    - podman save $IMAGE_NAME:$IMAGE_TAG | gzip > ../$CACHE_DIR/$CACHE_FILE
    - gunzip -c "../$CACHE_DIR/$CACHE_FILE" > ../$CACHE_DIR/image-${APP}.tar

    # Scan avec Trivy
    - ../trivy image --input ../$CACHE_DIR/image-${APP}.tar --format json --output trivy-report.json --severity HIGH,CRITICAL --no-progress || echo '{}' > trivy-report.json

    # Comptage des vulnérabilités critiques
    - CRITICAL_COUNT=$(../jq '[.Results[].Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-report.json)
    - echo "Nombre de vulnérabilités CRITIQUES détectées $CRITICAL_COUNT"

    # Condition push
    - |
      if [ "$CRITICAL_COUNT" -gt 0 ]; then
        echo "Push bloqué $CRITICAL_COUNT vulnérabilités critiques détectées."
        exit 1
      else
        echo "Push autorisé aucune vulnérabilité critique détectée."
        podman push $IMAGE_NAME:$IMAGE_TAG
        podman push $IMAGE_NAME:ci-$CI_COMMIT_SHORT_SHA
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"

# -------------------------
# SONARQUBE SCAN
# -------------------------
sonar-server:
  stage: sonar
  image: openjdk:17-jdk-slim
  before_script:
    - java -version
    - javac -version
    - mkdir -p $CI_PROJECT_DIR/.sonar
    - curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-4.8.0.2856-linux.zip
    - unzip sonar-scanner.zip -d $CI_PROJECT_DIR/.sonar
    - export PATH="$CI_PROJECT_DIR/.sonar/sonar-scanner-4.8.0.2856-linux/bin:$PATH"
    - sonar-scanner --version
  script:
    - sonar-scanner -Dsonar.projectKey="$SONAR_KEY_SERVER" -Dsonar.sources=. -Dsonar.host.url="$SONAR_HOST_URL" -Dsonar.token="$SONAR_PASSWORD_SERVER"
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"

# -------------------------
# DEPLOY IN OPENSHIFT 
# -------------------------
deploy-server:
  stage: oc-deploy
  image: quay.io/openshift/origin-cli:latest
  before_script:
    - echo "DockerHub login"
    - echo "$DOCKER_PASSWORD" | podman login --username "$DOCKER_USERNAME" --password-stdin docker.io || true
  when: manual
  script:
    - oc login $OPENSHIFT_API --token=$OPENSHIFT_TOKEN --insecure-skip-tls-verify
    # Vérification de l'existence du namespace
    - if oc get namespace $OPENSHIFT_NAMESPACE >/dev/null 2>&1; then
        echo "Namespace $OPENSHIFT_NAMESPACE existe déjà.";
      else
        echo "Namespace $OPENSHIFT_NAMESPACE inexistant. Création...";
        oc create namespace $OPENSHIFT_NAMESPACE;
      fi
      
    # Se positionner dans le namespace
    - oc project $OPENSHIFT_NAMESPACE
    - if oc get deployment mon-app-server >/dev/null 2>&1; then
        echo "Deployment mon-app-server existe déjà";
        oc rollout restart deployment/mon-app-server;
      else
        echo "Deployment 'mon-app-server' n'existe pas";
        oc create deployment mon-app-server --image=sonatelsn/new-staff-allocation-server:latest;
        oc expose deployment mon-app-server --port=8081;
        oc expose svc/mon-app-server;
      fi
    - sleep 80
    # Optionnel : liste des pods
    - oc get pods
    - oc get svc

  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
