stages:
  - test
  - docker
  - nexus

variables:
  GIT_COMMIT_SHORT: "$CI_COMMIT_SHORT_SHA"
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

default:
  image: node:18
  before_script:
    - cd server

cache:
  key: "server-node-modules-{{ checksum \"server/package-lock.json\" }}"
  paths:
    - server/node_modules/

test:
  stage: test
  script:
    - echo "🔍 Vérification des fichiers..."
    - ls -la
    - echo "📦 Installation des dépendances..."
    - npm ci
    - echo "✅ Vérification du point d'entrée..."
    - if [ ! -f "staffallocation.js" ] && [ ! -f "app.js" ]; then
        echo "❌ Aucun fichier principal trouvé";
        exit 1;
      else
        echo "✓ Fichier principal détecté";
      fi
  artifacts:
    paths:
      - server/node_modules/
    expire_in: 1h
  rules:
    - changes: [server/**]

docker:
  stage: docker
  image: docker:24.0
  services:
    - name: docker:dind
      alias: docker
      command: ["--tls=false"]
  script:
    - echo "🔐 Connexion à Docker Hub..."
    - echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin
    - echo "🐳 Construction de l'image backend..."
    - docker build -t "$DOCKER_USER/backend-app:$GIT_COMMIT_SHORT" .
    - docker push "$DOCKER_USER/backend-app:$GIT_COMMIT_SHORT"
    - docker tag "$DOCKER_USER/backend-app:$GIT_COMMIT_SHORT" "$DOCKER_USER/backend-app:latest"
    - docker push "$DOCKER_USER/backend-app:latest"
  needs: [test]
  rules:
    - changes: [server/**]

nexus:
  stage: nexus
  image: node:18
  script:
    - echo "🗝️ Création du fichier .npmrc avec authentification"
    - |
      echo "//$(echo $NEXUS_URL | sed 's|https\?://||'):_auth=$(echo -n $NEXUS_USER:$NEXUS_PASS | base64)" > .npmrc
      echo "always-auth=true" >> .npmrc
      echo "registry=$NEXUS_URL" >> .npmrc
    - echo "📦 Publication du package sur Nexus"
    - npm publish --registry "$NEXUS_URL"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [server/**]
    - if: '$CI_COMMIT_TAG'
      changes: [server/**]
